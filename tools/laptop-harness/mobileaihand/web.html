<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mobileAiHand</title>
<style>
  body { max-width: 44rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui,sans-serif; color: #1c2430; }
  label { display: block; margin-top: 1.2rem; font-weight: 600; }
  input, textarea, button { box-sizing: border-box; width: 100%; padding: .75rem; margin-top: .4rem; font: inherit; }
  textarea { min-height: 8rem; resize: vertical; }
  button { cursor: pointer; border: 0; border-radius: .4rem; background: #174ea6; color: white; }
  button:disabled { background: #8d98a9; cursor: default; }
  #approval { padding: 1rem; margin-top: 1.5rem; border: 1px solid #aab6c8; border-radius: .4rem; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f2f4f8; padding: 1rem; }
  .hint { color: #536274; }
</style>
<h1>mobileAiHand</h1>
<p>Describe a task for your paired Android phone. Review it before starting.</p>
<label for="token">Access token</label>
<input id="token" type="password" autocomplete="off" placeholder="Token shown when the server starts">
<label for="action">Task type</label>
<select id="action">
  <option value="general">Any phone task</option>
  <option value="reddit">Post to Reddit</option>
  <option value="whatsapp_photos">Send today's photos on WhatsApp</option>
  <option value="uninstall">Uninstall an app</option>
  <option value="chatgpt">Ask in the ChatGPT app</option>
</select>
<div id="fields"></div>
<label for="prompt" id="prompt-label">Phone task</label>
<textarea id="prompt" maxlength="2000" placeholder="Open Settings and tell me the Android version"></textarea>
<button id="prepare">Review task</button>
<section id="approval" hidden>
  <strong>Ready to run on your phone:</strong>
  <p id="preview"></p>
  <button id="approve">Run this task</button>
</section>
<p id="state" role="status" class="hint"></p>
<pre id="output" hidden></pre>
<script>
const token = document.querySelector('#token');
const prompt = document.querySelector('#prompt');
const action = document.querySelector('#action');
const fields = document.querySelector('#fields');
const state = document.querySelector('#state');
const output = document.querySelector('#output');
const approval = document.querySelector('#approval');
let taskId = null;
token.value = sessionStorage.getItem('mobileaihand-token') || '';
const fieldConfigs = {
  reddit: [['community', 'Reddit community (without r/)'], ['title', 'Post title'], ['body', 'Post body']],
  whatsapp_photos: [['contact', 'WhatsApp contact name']],
  uninstall: [['app', 'App name or package']],
  chatgpt: [['question', 'Question for the ChatGPT app']],
};
function showFields() {
  fields.replaceChildren();
  for (const [name, title] of fieldConfigs[action.value] || []) {
    const label = document.createElement('label');
    label.textContent = title;
    label.htmlFor = 'field-' + name;
    const input = document.createElement(name === 'body' || name === 'question' ? 'textarea' : 'input');
    input.id = 'field-' + name;
    input.maxLength = 2000;
    fields.append(label, input);
  }
  document.querySelector('#prompt-label').textContent = action.value === 'general'
    ? 'Phone task' : 'Additional instructions (optional)';
  prompt.placeholder = action.value === 'general' ? 'Open Settings and tell me the Android version' : '';
}
action.onchange = showFields;
showFields();
async function api(path, method = 'GET', body) {
  sessionStorage.setItem('mobileaihand-token', token.value);
  const response = await fetch(path, {
    method,
    headers: {'Authorization': 'Bearer ' + token.value, 'Content-Type': 'application/json'},
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await response.json();
  if (!response.ok) throw Error(data.error || 'Request failed');
  return data;
}
document.querySelector('#prepare').onclick = async () => {
  try {
    const details = {};
    for (const [name] of fieldConfigs[action.value] || []) {
      details[name] = document.querySelector('#field-' + name).value;
    }
    const task = await api('/api/tasks', 'POST', {prompt: prompt.value, action: action.value, details});
    taskId = task.id;
    document.querySelector('#preview').textContent = task.prompt;
    approval.hidden = false;
    output.hidden = true;
    state.textContent = 'Review the task, then start it.';
  } catch (error) { state.textContent = error.message; }
};
document.querySelector('#approve').onclick = async () => {
  try {
    await api('/api/tasks/' + taskId + '/approve', 'POST', {});
    approval.hidden = true;
    state.textContent = 'Running on the phone…';
    const poll = async () => {
      try {
        const task = await api('/api/tasks/' + taskId);
        if (task.state === 'running') { setTimeout(poll, 1000); return; }
        state.textContent = task.state === 'finished'
          ? 'Agent finished. Check its report and your phone to confirm the result.'
          : 'Agent stopped with an error.';
        output.textContent = task.output || '(No output from agent)';
        output.hidden = false;
      } catch (error) { state.textContent = error.message; }
    };
    poll();
  } catch (error) { state.textContent = error.message; }
};
</script>
</html>
